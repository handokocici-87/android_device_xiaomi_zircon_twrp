name: Build OrangeFox A16 - zircon

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            g++-multilib \
            gcc-multilib \
            gnupg \
            gperf \
            imagemagick \
            lib32readline-dev \
            lib32z1-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libncurses6 \
            libssl-dev \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

      - name: Initialize OrangeFox 16.0
        run: |
          mkdir -p $GITHUB_WORKSPACE/fox_16.0
          cd $GITHUB_WORKSPACE/fox_16.0

          git clone --depth=1 \
            -b 16.0 \
            https://gitlab.com/OrangeFox/sync.git \
            fox_sync

          cd fox_sync

          chmod +x orangefox_sync.sh

          ./orangefox_sync.sh \
            --branch 16.0 \
            --path $GITHUB_WORKSPACE/fox_16.0

      - name: Clone zircon device tree
        run: |
          cd $GITHUB_WORKSPACE/fox_16.0

          mkdir -p device/xiaomi

          git clone \
            https://github.com/handokocici-87/android_device_xiaomi_zircon_twrp.git \
            -b a15 \
            device/xiaomi/zircon

      - name: Prepare Android 16 device tree
        run: |
          cd $GITHUB_WORKSPACE/fox_16.0

          sed -i 's/PLATFORM_VERSION := 15/PLATFORM_VERSION := 16/g' \
            device/xiaomi/zircon/BoardConfig.mk

          echo "===== PLATFORM ====="
          grep -n "PLATFORM_VERSION" device/xiaomi/zircon/BoardConfig.mk || true

          echo "===== ZIRCON TREE ====="
          ls -la device/xiaomi/zircon

      - name: Setup build environment
        run: |
          cd $GITHUB_WORKSPACE/fox_16.0
          source build/envsetup.sh

          lunch fox_zircon-eng

      - name: Build OrangeFox vendor_boot
        run: |
          cd $GITHUB_WORKSPACE/fox_16.0
          source build/envsetup.sh
          lunch fox_zircon-eng

          mka vendorbootimage -j$(nproc --all)

      - name: Collect build files
        run: |
          mkdir -p $GITHUB_WORKSPACE/output

          find $GITHUB_WORKSPACE/fox_16.0/out/target/product/zircon \
            -maxdepth 1 \
            -type f \
            \( -name "*vendor_boot*" -o -name "recovery*" \) \
            -exec cp -v {} $GITHUB_WORKSPACE/output/ \; \
            || true

          ls -lah $GITHUB_WORKSPACE/output

      - name: Upload OrangeFox build
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-A16-zircon
          path: output/
