name: Build OrangeFox A15

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Bebaskan Ruang Disk
    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
        sudo apt-get clean
        df -h

    # 2. Install Dependencies & Repo Tool
    - name: Build Environment Setup
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev \
          gcc-multilib g++-multilib libc6-dev-i386 lib32z1-dev lib32stdc++6 \
          libncurses6 libncursesw6 x11proto-core-dev libx11-dev lib32z-dev \
          ccache libgl1-mesa-dev libxml2-utils xsltproc unzip python3 \
          bc bison cpio lzop pngcrush rsync schedtool squashfs-tools \
          libssl-dev liblz4-tool imagemagick lib32readline-dev
        
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH
        
        git config --global user.email "builder@github.com"
        git config --global user.name "GitHub Builder"

    # 3. Clone Source & Device Tree
    - name: Clone OrangeFox Source & Device Tree
      run: |
        mkdir -p $HOME/OrangeFox_Workspace
        cd $HOME/OrangeFox_Workspace
        
        # Sync OrangeFox 14.1
        git clone --depth=1 -b master https://gitlab.com/OrangeFox/sync.git fox_sync
        cd fox_sync
        chmod +x orangefox_sync.sh
        ./orangefox_sync.sh --branch 14.1 --path $HOME/OrangeFox_Workspace/fox_src
        
        # Masuk ke folder source
        cd $HOME/OrangeFox_Workspace/fox_src
        
        # Clone device tree zircon (Branch a15 sudah berisi AndroidProducts.mk yang benar)
        mkdir -p device/xiaomi
        git clone https://github.com/handokocici-87/android_device_xiaomi_zircon_twrp.git -b a15 device/xiaomi/zircon

    # 4. Proses Build (Langsung Lunch & MKA)
    - name: Build Recovery
      run: |
        cd $HOME/OrangeFox_Workspace/fox_src
        source build/envsetup.sh
        
        # Langsung lunch karena kita sudah yakin filenya ada (terbukti di log sebelumnya)
        lunch omni_zircon-eng
        
        # Build menggunakan semua core CPU
        mka adbd recoveryimage -j$(nproc --all)
        
    # 5. Upload Hasil Build
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-Recovery-Zircon-A15
        path: $HOME/OrangeFox_Workspace/fox_src/out/target/product/zircon/recovery.img
        
