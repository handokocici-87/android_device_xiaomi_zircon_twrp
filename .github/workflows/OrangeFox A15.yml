name: Build OrangeFox A15

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Checkout Repository Device Tree (untuk mengambil file mk terbaru)
    - uses: actions/checkout@v4
      with:
        path: device_tree_source # Simpan di folder terpisah agar tidak tertimpa

    # 2. Bebaskan Ruang Disk
    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
        sudo apt-get clean
        df -h

    # 3. Install Dependencies & Repo Tool
    - name: Build Environment Setup
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev \
          gcc-multilib g++-multilib libc6-dev-i386 lib32z1-dev lib32stdc++6 \
          libncurses6 libncursesw6 x11proto-core-dev libx11-dev lib32z-dev \
          ccache libgl1-mesa-dev libxml2-utils xsltproc unzip python3 \
          bc bison cpio lzop pngcrush rsync schedtool squashfs-tools \
          libssl-dev liblz4-tool imagemagick lib32readline-dev
        
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH
        
        git config --global user.email "builder@github.com"
        git config --global user.name "GitHub Builder"

    # 4. Clone Source & Device Tree
    - name: Clone OrangeFox Source & Device Tree
      run: |
        mkdir -p $HOME/OrangeFox_Workspace
        cd $HOME/OrangeFox_Workspace
        
        git clone --depth=1 -b master https://gitlab.com/OrangeFox/sync.git fox_sync
        cd fox_sync
        chmod +x orangefox_sync.sh
        ./orangefox_sync.sh --branch 14.1 --path $HOME/OrangeFox_Workspace/fox_src
        
        # Masuk ke folder source
        cd $HOME/OrangeFox_Workspace/fox_src
        
        # Clone device tree zircon
        mkdir -p device/xiaomi
        git clone https://github.com/handokocici-87/android_device_xiaomi_zircon_twrp.git -b a15 device/xiaomi/zircon

    # 5. Verifikasi & Perbaikan File Konfigurasi (PENTING!)
    - name: Verify & Fix Lunch Combo
      run: |
        SRC_DIR=$HOME/OrangeFox_Workspace/fox_src
        DT_DIR=$SRC_DIR/device/xiaomi/zircon
        LOCAL_DT_DIR=$GITHUB_WORKSPACE/device_tree_source
        
        echo "=== Mengecek AndroidProducts.mk ==="
        cat $DT_DIR/AndroidProducts.mk
        
        echo "=== Mengecek omni_zircon.mk ==="
        if [ -f "$DT_DIR/omni_zircon.mk" ]; then
            echo "File omni_zircon.mk DITEMUKAN di device tree."
        else
            echo "File omni_zircon.mk TIDAK ADA! Menyalin dari repository lokal..."
            cp $LOCAL_DT_DIR/omni_zircon.mk $DT_DIR/omni_zircon.mk
            echo "File berhasil disalin."
        fi
        
        echo "=== Memastikan terdaftar di AndroidProducts.mk ==="
        if grep -q "omni_zircon.mk" $DT_DIR/AndroidProducts.mk; then
            echo "Sudah terdaftar dengan benar."
        else
            echo "Belum terdaftar! Menambahkan secara paksa..."
            echo '    $(LOCAL_DIR)/omni_zircon.mk \' >> $DT_DIR/AndroidProducts.mk
            echo '    omni_zircon-eng' >> $DT_DIR/AndroidProducts.mk # Tambah ke lunch choices jika perlu
            cat $DT_DIR/AndroidProducts.mk
        fi

    # 6. Proses Build
    - name: Sync & Build
      run: |
        cd $HOME/OrangeFox_Workspace/fox_src
        source build/envsetup.sh
        
        # Cek apakah lunch combo valid sebelum build
        echo "Mencoba lunch omni_zircon-eng..."
        lunch omni_zircon-eng || {
            echo "Lunch gagal! Mencoba lunch twrp_zircon-eng sebagai cadangan..."
            lunch twrp_zircon-eng
        }
        
        mka adbd recoveryimage -j$(nproc --all)
        
    # 7. Upload Hasil Build
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-Recovery-Zircon-A15
        path: $HOME/OrangeFox_Workspace/fox_src/out/target/product/zircon/recovery.img
        
