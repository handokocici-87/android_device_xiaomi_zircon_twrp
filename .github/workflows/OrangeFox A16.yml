name: Build OrangeFox 12.1 - zircon - Android 16

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FOX_DIR: ${{ github.workspace }}/fox_src
  SYNC_DIR: ${{ github.workspace }}/orangefox_sync

  DEVICE_REPO: https://github.com/handokocici-87/android_device_xiaomi_zircon_twrp.git
  DEVICE_BRANCH: a15
  DEVICE_PATH: device/xiaomi/zircon
  DEVICE_NAME: zircon

  BUILD_TARGET: vendorbootimage
  LUNCH_TARGET: twrp_zircon-eng

jobs:
  build:
    name: OrangeFox 12.1 - zircon
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout zircon repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. CHECK WORKSPACE
      # ============================================================
      - name: Check GitHub workspace
        shell: bash
        run: |
          set -euxo pipefail

          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "HOME=$HOME"
          echo "PWD=$(pwd)"

          echo ""
          echo "Workspace:"
          ls -lah "$GITHUB_WORKSPACE"

      # ============================================================
      # 3. FREE DISK
      # ============================================================
      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail

          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/powershell || true

          df -h

      # ============================================================
      # 4. DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses6 \
            lib32z1 \
            libc6-dev-i386 \
            libelf-dev \
            liblz4-tool \
            libncurses5-dev \
            libncurses6 \
            libncurses-dev \
            libssl-dev \
            lzop \
            m4 \
            openssl \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

      # ============================================================
      # 5. INSTALL REPO
      # ============================================================
      - name: Install repo tool
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version

      # ============================================================
      # 6. PREPARE DIRECTORIES
      # ============================================================
      - name: Prepare OrangeFox workspace
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$FOX_DIR"
          rm -rf "$SYNC_DIR"

          mkdir -p "$FOX_DIR"
          mkdir -p "$SYNC_DIR"

          echo "FOX_DIR=$FOX_DIR"
          echo "SYNC_DIR=$SYNC_DIR"

          test -d "$FOX_DIR"
          test -d "$SYNC_DIR"

      # ============================================================
      # 7. CLONE ORANGEFOX SYNC
      # ============================================================
      - name: Clone OrangeFox sync
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          git clone \
            --depth=1 \
            https://gitlab.com/OrangeFox/sync.git \
            "$SYNC_DIR"

          echo ""
          echo "OrangeFox sync repository:"
          find "$SYNC_DIR" -maxdepth 2 -type f | sort | head -100

          test -f "$SYNC_DIR/orangefox_sync.sh"

          chmod +x "$SYNC_DIR/orangefox_sync.sh"

          "$SYNC_DIR/orangefox_sync.sh" --help || true

      # ============================================================
      # 8. SYNC ORANGEFOX 12.1
      # ============================================================
      - name: Sync OrangeFox 12.1
        shell: bash
        run: |
          set -euxo pipefail

          SYNC_SCRIPT="$SYNC_DIR/orangefox_sync.sh"

          test -x "$SYNC_SCRIPT"
          test -d "$FOX_DIR"

          echo ""
          echo "=========================================="
          echo "SYNC ORANGEFOX 12.1"
          echo "=========================================="

          "$SYNC_SCRIPT" \
            --branch 12.1 \
            --path "$FOX_DIR"

          echo ""
          echo "=========================================="
          echo "VERIFY ORANGEFOX SOURCE"
          echo "=========================================="

          test -d "$FOX_DIR/.repo"
          test -d "$FOX_DIR/bootable/recovery"

          echo "OrangeFox source OK."

          du -sh "$FOX_DIR"

      # ============================================================
      # 9. INSTALL ZIRCON DEVICE TREE
      # ============================================================
      - name: Install zircon device tree
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$FOX_DIR/device/xiaomi"

          rm -rf "$FOX_DIR/$DEVICE_PATH"

          git clone \
            --depth=1 \
            --branch "$DEVICE_BRANCH" \
            "$DEVICE_REPO" \
            "$FOX_DIR/$DEVICE_PATH"

          cd "$FOX_DIR/$DEVICE_PATH"

          echo ""
          echo "=========================================="
          echo "ZIRCON DEVICE TREE"
          echo "=========================================="

          git remote -v

          echo ""
          echo "Branch:"
          git branch --show-current

          echo ""
          echo "Commit:"
          git log -1 --oneline

          echo ""
          echo "Top-level files:"
          find . -maxdepth 2 -type f | sort | head -300

      # ============================================================
      # 10. VERIFY DEVICE TREE
      # ============================================================
      - name: Verify zircon device tree
        shell: bash
        run: |
          set -euxo pipefail

          cd "$FOX_DIR"

          echo "Checking required zircon files..."

          test -f "$DEVICE_PATH/BoardConfig.mk"
          test -f "$DEVICE_PATH/AndroidProducts.mk"
          test -f "$DEVICE_PATH/twrp_zircon.mk"

          echo "OK: BoardConfig.mk"
          echo "OK: AndroidProducts.mk"
          echo "OK: twrp_zircon.mk"

          if [ -f "$DEVICE_PATH/fox_zircon.mk" ]; then
            echo "OK: fox_zircon.mk"
          else
            echo "INFO: fox_zircon.mk not present"
          fi

      # ============================================================
      # 11. AUDIT ZIRCON
      # ============================================================
      - name: Audit zircon Android 16 compatibility
        shell: bash
        run: |
          set -euxo pipefail

          cd "$FOX_DIR"

          REPORT="$GITHUB_WORKSPACE/zircon_audit.txt"

          : > "$REPORT"

          {
            echo "=================================================="
            echo "REDMI NOTE 13 PRO+ 5G - ZIRCON"
            echo "ORANGEFOX 12.1 / ANDROID 16 AUDIT"
            echo "=================================================="
            echo ""

            echo "DEVICE=$DEVICE_NAME"
            echo "DEVICE_BRANCH=$DEVICE_BRANCH"
            echo "DEVICE_PATH=$DEVICE_PATH"

            echo ""
            echo "=================================================="
            echo "BOARD CONFIG"
            echo "=================================================="

            sed -n '1,350p' \
              "$DEVICE_PATH/BoardConfig.mk"

            echo ""
            echo "=================================================="
            echo "ANDROID PRODUCTS"
            echo "=================================================="

            sed -n '1,250p' \
              "$DEVICE_PATH/AndroidProducts.mk"

            echo ""
            echo "=================================================="
            echo "TWRP PRODUCT"
            echo "=================================================="

            sed -n '1,250p' \
              "$DEVICE_PATH/twrp_zircon.mk"

            if [ -f "$DEVICE_PATH/fox_zircon.mk" ]; then
              echo ""
              echo "=================================================="
              echo "ORANGEFOX PRODUCT"
              echo "=================================================="

              sed -n '1,300p' \
                "$DEVICE_PATH/fox_zircon.mk"
            fi

            echo ""
            echo "=================================================="
            echo "FBE / METADATA / DATA"
            echo "=================================================="

            grep -RniE \
              'metadata|userdata|/data|/metadata|metadata_encryption|keydirectory|inlinecrypt|fscrypt|fsverity|fileencryption|wrappedkey|TW_INCLUDE_CRYPTO|TW_INCLUDE_FBE|TW_USE_FSCRYPT' \
              "$DEVICE_PATH" \
              --include='*.mk' \
              --include='*.fstab' \
              --include='*fstab*' \
              --include='*.rc' \
              --include='*.prop' \
              || true

            echo ""
            echo "=================================================="
            echo "KEYMASTER / KEYMINT / VOLD"
            echo "=================================================="

            grep -RniE \
              'KEYMASTER|KEYMINT|VOLD|FSCRYPT|FBE|DECRYPT|ENCRYPT' \
              "$DEVICE_PATH" \
              --include='*.mk' \
              --include='*.fstab' \
              --include='*fstab*' \
              --include='*.rc' \
              --include='*.prop' \
              || true

            echo ""
            echo "=================================================="
            echo "VENDOR BOOT"
            echo "=================================================="

            grep -RniE \
              'BOARD_BOOT_HEADER_VERSION|BOARD_VENDOR_BOOT|VENDOR_BOOT|BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT|RECOVERY_RAMDISK|VENDOR_RAMDISK|vendor_boot' \
              "$DEVICE_PATH" \
              --include='*.mk' \
              --include='*.bp' \
              --include='*.rc' \
              || true

            echo ""
            echo "=================================================="
            echo "AUDIT COMPLETE"
            echo "=================================================="

          } | tee "$REPORT"

      # ============================================================
      # 12. UPLOAD AUDIT
      # ============================================================
      - name: Upload zircon audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zircon-android16-audit
          path: zircon_audit.txt
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # 13. CONFIGURE ORANGEFOX
      # ============================================================
      - name: Configure OrangeFox variables
        shell: bash
        run: |
          set -euxo pipefail

          echo "FOX_BUILD_DEVICE=zircon" >> "$GITHUB_ENV"
          echo "FOX_AB_DEVICE=1" >> "$GITHUB_ENV"
          echo "FOX_VIRTUAL_AB_DEVICE=1" >> "$GITHUB_ENV"
          echo "OF_DEFAULT_KEYMASTER_VERSION=4.0" >> "$GITHUB_ENV"
          echo "ALLOW_MISSING_DEPENDENCIES=true" >> "$GITHUB_ENV"

          echo "FOX_BUILD_DEVICE=zircon"
          echo "FOX_AB_DEVICE=1"
          echo "FOX_VIRTUAL_AB_DEVICE=1"
          echo "OF_DEFAULT_KEYMASTER_VERSION=4.0"

      # ============================================================
      # 14. SETUP BUILD
      # ============================================================
      - name: Setup OrangeFox build environment
        shell: bash
        run: |
          set -euxo pipefail

          cd "$FOX_DIR"

          export FOX_BUILD_DEVICE=zircon
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export OF_DEFAULT_KEYMASTER_VERSION=4.0
          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh

          echo ""
          echo "ANDROID_BUILD_TOP=$ANDROID_BUILD_TOP"

          echo ""
          echo "Available zircon targets:"

          lunch --list 2>/dev/null \
            | grep -i zircon \
            || true

      # ============================================================
      # 15. LUNCH
      # ============================================================
      - name: Select zircon target
        shell: bash
        run: |
          set -euxo pipefail

          cd "$FOX_DIR"

          export FOX_BUILD_DEVICE=zircon
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export OF_DEFAULT_KEYMASTER_VERSION=4.0
          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh

          lunch "$LUNCH_TARGET"

          echo ""
          echo "TARGET_PRODUCT=$TARGET_PRODUCT"
          echo "TARGET_DEVICE=$TARGET_DEVICE"
          echo "TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT"

      # ============================================================
      # 16. DISPLAY CONFIG
      # ============================================================
      - name: Display zircon configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd "$FOX_DIR"

          echo "=========================================="
          echo "BOARD CONFIG"
          echo "=========================================="

          sed -n '1,350p' \
            "$DEVICE_PATH/BoardConfig.mk"

          echo ""
          echo "=========================================="
          echo "ALL FSTAB FILES"
          echo "=========================================="

          find "$DEVICE_PATH" \
            -type f \
            \( -name '*fstab*' -o -name 'fstab.*' \) \
            -print \
            -exec sh -c 'echo "----- $1 -----"; sed -n "1,350p" "$1"' _ {} \; \
            || true

      # ============================================================
      # 17. BUILD
      # ============================================================
      - name: Build recovery
        shell: bash
        run: |
          set -euxo pipefail

          cd "$FOX_DIR"

          export FOX_BUILD_DEVICE=zircon
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export OF_DEFAULT_KEYMASTER_VERSION=4.0
          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh

          lunch "$LUNCH_TARGET"

          echo ""
          echo "=========================================="
          echo "BUILD ORANGEFOX 12.1"
          echo "=========================================="

          echo "Device: zircon"
          echo "ROM environment: Android 16"
          echo "OrangeFox source: 12.1"
          echo "Target: vendorbootimage"

          echo ""
          echo "Starting build..."

          mka \
            "$BUILD_TARGET" \
            -j"$(nproc --all)" \
            ALLOW_MISSING_DEPENDENCIES=true \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          test "${PIPESTATUS[0]}" -eq 0

      # ============================================================
      # 18. LOCATE IMAGE
      # ============================================================
      - name: Locate vendor_boot image
        shell: bash
        run: |
          set -euxo pipefail

          PRODUCT_DIR="$FOX_DIR/out/target/product/$DEVICE_NAME"

          echo "=========================================="
          echo "PRODUCT DIRECTORY"
          echo "=========================================="

          ls -lah "$PRODUCT_DIR"

          echo ""
          echo "Image files:"

          find "$PRODUCT_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.img' \
            -printf '%f %s bytes\n' \
            | sort

          if [ ! -f "$PRODUCT_DIR/vendor_boot.img" ]; then
            echo ""
            echo "ERROR: vendor_boot.img was not produced."
            exit 1
          fi

          echo "ORANGEFOX_OUTPUT=$PRODUCT_DIR/vendor_boot.img" \
            >> "$GITHUB_ENV"

      # ============================================================
      # 19. VERIFY IMAGE
      # ============================================================
      - name: Verify vendor_boot image
        shell: bash
        run: |
          set -euxo pipefail

          IMAGE="$ORANGEFOX_OUTPUT"

          echo "=========================================="
          echo "RECOVERY IMAGE"
          echo "=========================================="

          ls -lh "$IMAGE"

          echo ""
          file "$IMAGE"

          echo ""
          echo "SHA256:"
          sha256sum "$IMAGE"

          echo ""
          echo "FIRST 64 BYTES:"
          od -An -tx1 -N64 "$IMAGE"

      # ============================================================
      # 20. PACKAGE
      # ============================================================
      - name: Package recovery
        shell: bash
        run: |
          set -euxo pipefail

          RELEASE="$GITHUB_WORKSPACE/release"

          rm -rf "$RELEASE"
          mkdir -p "$RELEASE"

          cp \
            "$ORANGEFOX_OUTPUT" \
            "$RELEASE/OrangeFox-12.1-zircon-Android16-vendor_boot.img"

          cp \
            "$GITHUB_WORKSPACE/zircon_audit.txt" \
            "$RELEASE/zircon_audit.txt"

          cp \
            "$GITHUB_WORKSPACE/build.log" \
            "$RELEASE/build.log"

          sha256sum \
            "$RELEASE/OrangeFox-12.1-zircon-Android16-vendor_boot.img" \
            > "$RELEASE/SHA256SUMS.txt"

          cat > "$RELEASE/README.txt" <<'EOF'
          OrangeFox 12.1 - zircon
          Redmi Note 13 Pro+

          Recovery source:
          OrangeFox 12.1

          Target ROM:
          Android 16

          Recovery target:
          vendor_boot.img

          Device:
          zircon

          Device tree:
          android_device_xiaomi_zircon_twrp

          Device tree branch:
          a15

          Build target:
          twrp_zircon-eng
          vendorbootimage

          Vendor boot:
          Header version 4

          FBE:
          Enabled

          Metadata:
          Supported by the device tree

          Keymaster:
          4.0

          IMPORTANT:
          This build does not automatically format /data.

          This build does not automatically format /metadata.

          This build does not disable FBE.

          This build does not force DFE.

          Do not format /data or /metadata merely because
          internal storage initially shows 0 MB.

          First collect recovery logs and inspect:
          - /metadata
          - /data
          - KeyMint/Keymaster
          - vold
          - fscrypt
          - recovery.fstab
          EOF

          echo ""
          echo "=========================================="
          echo "RELEASE"
          echo "=========================================="

          ls -lah "$RELEASE"

      # ============================================================
      # 21. UPLOAD SUCCESS
      # ============================================================
      - name: Upload OrangeFox artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-12.1-zircon-Android16
          path: release/
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 22. UPLOAD DIAGNOSTICS ON FAILURE
      # ============================================================
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-12.1-zircon-build-diagnostics
          path: |
            build.log
            zircon_audit.txt
            ${{ env.FOX_DIR }}/out/target/product/zircon/*.img
          if-no-files-found: warn
          retention-days: 14
